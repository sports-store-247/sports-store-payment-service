name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: sports-store-payment-service

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push:false — a PR must never publish an image, only prove the
      # Dockerfile builds. load:true pulls the built image into the local
      # Docker daemon so the trivy job below can scan it.
      - name: Build image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Save image for trivy job
        run: docker save ${{ env.IMAGE_NAME }}:ci -o /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  trivy:
    name: trivy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ env.IMAGE_NAME }}.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  push-to-ecr:
    name: push-to-ecr
    needs: [test, build, trivy]
    runs-on: ubuntu-latest
    # Only runs on an actual push to main, never on a PR — a PR must
    # never publish an image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag (VERSION + short SHA, never latest)
        id: version
        run: echo "tag=$(cat VERSION)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (GitHub Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::765858872029:role/sports-store-github-actions-ecr-role
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}

  update-gitops:
    name: update-gitops
    needs: push-to-ecr
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Microservice
        uses: actions/checkout@v4

      - name: Compute image tag
        id: version
        run: echo "tag=$(cat VERSION)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: sports-store-247/sports-store-deployments
          token: ${{ secrets.GITOPS_PAT }}
          path: deployments

      - name: Update images.yaml
        run: |
          cd deployments
          SERVICE_KEY=${IMAGE_NAME#sports-store-}
          BRANCH_NAME="update-${SERVICE_KEY}-${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          yq -i ".services.${SERVICE_KEY}.image.tag = \"${{ steps.version.outputs.tag }}\"" helm/sports-store/environments/production/images.yaml
          git add helm/sports-store/environments/production/images.yaml
          git commit -m "chore(gitops): update ${SERVICE_KEY} image to ${{ steps.version.outputs.tag }}"
          git push -u origin $BRANCH_NAME
          gh pr create --title "chore(gitops): update ${SERVICE_KEY} image to ${{ steps.version.outputs.tag }}" --body "Automated image update."
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
