  #   - Separate `on: push: branches: [main]` trigger (or a second
  #     workflow file), gated so it never runs on a PR.
  #   - needs: [test, build, trivy]
  #   - permissions: id-token: write   (required for OIDC — add at the
  #     job level, don't widen it for the whole workflow)
  #   - Read VERSION file + short SHA -> tag, e.g. 1.2.0-${GITHUB_SHA::7}
  #   - aws-actions/configure-aws-credentials@v4 with role-to-assume set
  #     to the OIDC role from sports-store-infrastructure's
